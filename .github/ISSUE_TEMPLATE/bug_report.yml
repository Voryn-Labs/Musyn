name: Bug report
description: Report a reproducible Musyn issue
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Musyn version and build
      placeholder: "0.3.1 (13)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iOS version, device and installer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional redacted logs or screenshots
      description: Settings → Support can upload a redacted preview to dpaste. Paste its link here after reviewing it. Do not include provider keys, account cookies, tokens, private links or signing credentials.
