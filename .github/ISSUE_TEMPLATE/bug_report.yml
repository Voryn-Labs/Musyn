name: Bug report
description: Report a reproducible Musyn issue
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Musyn version and build
      placeholder: "0.1.0 (1)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iOS version, device and installer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional redacted logs or screenshots
      description: Do not include account cookies, tokens, private links or signing credentials.
