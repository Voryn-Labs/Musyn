name: Build Musyn iOS
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release and update the installer source
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: musyn-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
          python3 scripts/verify_branding.py
          python3 scripts/check_public_release.py
          python3 scripts/test_native_artwork.py
          python3 scripts/test_native_now_playing.py
          python3 scripts/test_native_sing.py
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner.xcodeproj/project.pbxproj
      - name: Build unsigned iOS app
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign
      - name: Package and verify
        id: package
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -q -r Musyn.ipa Payload
          shasum -a 256 Musyn.ipa > Musyn.ipa.sha256
          cd ../..
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/ios/iphoneos/Runner.app/Info.plist)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          python3 scripts/check_public_release.py --ipa build/ipa/Musyn.ipa
          python3 scripts/release_feed.py --ipa build/ipa/Musyn.ipa --tag "v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: Musyn-ios-${{ github.run_number }}
          path: |
            build/ipa/Musyn.ipa
            build/ipa/Musyn.ipa.sha256
            source.json
            apps.json
          if-no-files-found: error
      - name: Publish release
        if: inputs.publish || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already exists. Increment the version before publishing.'
            exit 1
          fi
          NOTES="docs/releases/${RELEASE_TAG#v}.md"
          [ -f "$NOTES" ] || NOTES="docs/releases/0.1.0.md"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Musyn ${RELEASE_TAG#v} — Voryn Labs" --notes-file "$NOTES" --latest build/ipa/Musyn.ipa build/ipa/Musyn.ipa.sha256 source.json apps.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add source.json apps.json
          git commit -m 'chore(release): publish Musyn installer feed'
          git push origin HEAD:main
