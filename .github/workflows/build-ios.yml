name: Build Musyn iOS
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false
      prerelease:
        description: Publish to the preview channel without replacing stable
        type: boolean
        default: true
      release_tag:
        description: Optional tag, for example v0.4.0-beta.1
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: musyn-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
          python3 scripts/verify_branding.py
          python3 scripts/check_public_release.py
          python3 scripts/test_native_artwork.py
          python3 scripts/test_native_now_playing.py
          python3 scripts/test_native_sing.py
          python3 scripts/test_native_sing_reader.py
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner.xcodeproj/project.pbxproj
      - name: Build unsigned iOS app
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign
      - name: Package and verify
        id: package
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -q -r Musyn.ipa Payload
          shasum -a 256 Musyn.ipa > Musyn.ipa.sha256
          cd ../..
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/ios/iphoneos/Runner.app/Info.plist)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          python3 scripts/check_public_release.py --ipa build/ipa/Musyn.ipa
          FEED_TAG="${{ inputs.release_tag }}"
          if [ -z "$FEED_TAG" ]; then FEED_TAG="v$VERSION"; fi
          python3 scripts/release_feed.py --ipa build/ipa/Musyn.ipa --tag "$FEED_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: Musyn-ios-${{ github.run_number }}
          path: |
            build/ipa/Musyn.ipa
            build/ipa/Musyn.ipa.sha256
            source.json
            apps.json
          if-no-files-found: error
      - name: Publish release
        if: inputs.publish || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then RELEASE_TAG="$REQUESTED_TAG"; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already exists. Increment the version before publishing.'
            exit 1
          fi
          NOTES='Preview: local Smart Library with ratings, tags, moods, rule-based collections, smarter shuffle, curated accents and Home Screen widgets. Existing playback, downloads, lyrics and provider support remain available.'
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Musyn ${RELEASE_TAG#v} Preview — Voryn Labs" --notes "$NOTES" --prerelease build/ipa/Musyn.ipa build/ipa/Musyn.ipa.sha256
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Musyn ${RELEASE_TAG#v} — Voryn Labs" --notes "$NOTES" --latest build/ipa/Musyn.ipa build/ipa/Musyn.ipa.sha256 source.json apps.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add source.json apps.json
          git commit -m 'chore(release): publish Musyn installer feed'
          git push origin HEAD:main
